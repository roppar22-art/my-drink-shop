<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Recent Orders</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .order { border-left: 5px solid #c8a96e; background: #eee; padding: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h2>Admin Dashboard</h2>
    {% for o in orders %}
    <div class="order">
        <p><b>Order ID:</b> {{ o.id }}</p>
        <p><b>Items:</b> {% for i in o.items %} {{ i.name }}, {% endfor %}</p>
        <p><b>Amount:</b> {{ o.total }} Ks</p>
    </div>
    {% endfor %}
    <a href="/">Exit Admin</a>
</body>
</html>
