<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <style>
        body { font-family: sans-serif; background: #f9f7f2; padding: 20px; }
        .form-box { background: white; padding: 25px; border-radius: 15px; }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .confirm-btn { background: #d4a373; color: white; border: none; width: 100%; padding: 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>Order Confirmation</h2>
        <form action="/confirm" method="POST">
            <input type="text" name="customer_name" placeholder="သင့်နာမည်" required>
            <textarea name="address" rows="3" placeholder="ပို့ဆောင်ရမည့် လိပ်စာ" required></textarea>
            <button type="submit" class="confirm-btn">အော်ဒါတင်မည် (Confirm Order)</button>
        </form>
    </div>
</body>
</html>
