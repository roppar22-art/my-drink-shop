<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f9f7f2; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .item { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding: 10px 0; }
        .btn { display: block; width: 100%; padding: 15px; background: #e31837; color: white; text-align: center; text-decoration: none; border-radius: 8px; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Your Cart</h2>
        {% for item in items %}
        <div class="item"><span>{{ item.name }}</span><span>{{ item.price }} Ks</span></div>
        {% endfor %}
        <h3 style="text-align:right; color:#e31837;">Total: {{ total }} Ks</h3>
        <a href="/checkout" class="btn">CHECKOUT</a>
        <a href="/" style="display:block; text-align:center; margin-top:15px; color:#666;">Back to Menu</a>
    </div>
</body>
</html>
