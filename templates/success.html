<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>မှာယူမှု အောင်မြင်ပါသည်</title>
    <style>
        body { font-family: sans-serif; background-color: #fcf8f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 400px; width: 90%; }
        h1 { color: #2e7d32; margin-bottom: 10px; }
        p { color: #5d4037; line-height: 1.6; }
        .back-btn { display: inline-block; margin-top: 25px; background: #5d4037; color: white; padding: 12px 25px; border-radius: 25px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>✅ မှာယူမှု အောင်မြင်ပါသည်</h1>
        <p>လူကြီးမင်း မှာယူသော <b>{{ drink_name }}</b> ကို<br><b>{{ address }}</b> သို့ မကြာမီ ပို့ဆောင်ပေးပါမည်။</p>
        <p>ပစ္စည်းရောက်မှ ငွေချေပေးပါ (COD)</p>
        <a href="/" class="back-btn">ဆိုင်သို့ ပြန်သွားရန်</a>
    </div>
</body>
</html>
