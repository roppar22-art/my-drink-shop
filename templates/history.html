<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History</title>
    <style>
        body { font-family: sans-serif; background: #f5f5f5; padding: 20px; }
        .order-card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 5px solid #c8a96e; }
        .status { font-weight: bold; float: right; color: #a0824a; }
    </style>
</head>
<body>
    <h2>My Order History</h2>
    {% for o in orders %}
    <div class="order-card">
        <span class="status">{{ o[4] }}</span>
        <strong>Order #{{ o[0] }}</strong>
        <p style="font-size: 0.9rem; color: #666;">{{ o[2] }}</p>
        <p>Total: {{ o[3] }} Ks</p>
    </div>
    {% endfor %}
    <a href="/">Back to Home</a>
</body>
</html>
