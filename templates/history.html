<!DOCTYPE html>
<html>
<head><title>Order History - Tinzar Coffee</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"><style>body{font-family:Inter; background:#fefaf5; padding:2rem;} .order-card{background:white; border-radius:28px; padding:1.5rem; margin-bottom:1rem;}</style></head>
<body><div class="container" style="max-width:800px; margin:auto;"><h1><i class="fas fa-history"></i> Your Orders</h1><a href="/">← Back to Shop</a>{% for order in orders %}<div class="order-card"><p><strong>Order #{{ order[0] }}</strong> - Status: {{ order[3] }}</p><p>Items:<br/>{{ order[1]|safe }}</p><p>Total: ${{ "%.2f"|format(order[2]/100) }}</p></div>{% else %}<p>No orders yet.</p>{% endfor %}</div></body></html>
