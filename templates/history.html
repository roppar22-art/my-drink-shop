<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 15px; }
        .order-card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 10px; border-left: 5px solid #e31837; display: flex; justify-content: space-between; align-items: center; }
        .status { font-weight: bold; font-size: 0.8rem; padding: 4px 10px; border-radius: 20px; }
        .Pending { background: #fff3cd; color: #856404; }
        .Confirmed { background: #d4edda; color: #155724; }
        .Cancelled { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h2 style="text-align:center;">Your Orders</h2>
    {% for o in orders %}
    <div class="order-card">
        <div>
            <b>Order #{{ o[0] }}</b><br>
            <small style="color:#666;">{{ o[1] }}</small>
        </div>
        <span class="status {{ o[2] }}">{{ o[2]|upper }}</span>
    </div>
    {% endfor %}
    <a href="/" style="display:block; text-align:center; color:#e31837; text-decoration:none; margin-top:20px;">BACK TO HOME</a>
</body>
</html>
