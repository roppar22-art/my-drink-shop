<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <style>
        body { font-family: sans-serif; background: #eee; padding: 15px; }
        .box { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn { padding: 10px 15px; border: none; border-radius: 5px; color: white; font-weight: bold; cursor: pointer; text-decoration: none; margin-right: 10px; font-size: 0.8rem; }
    </style>
</head>
<body>
    <h2>Admin - Manage Orders</h2>
    {% for o in orders %}
    <div class="box">
        <p><b>Order ID: #{{ o[0] }}</b> <span style="float:right; color:red;">{{ o[4] }}</span></p>
        <p>Customer: {{ o[1] }}<br>Address: {{ o[2] }}</p>
        <p>Items: <span style="color:#555;">{{ o[3] }}</span></p>
        
        {% if o[4] == 'Pending' %}
        <a href="/update_status/{{ o[0] }}/Confirmed?pw={{ pw }}" class="btn" style="background:green;">CONFIRM</a>
        <a href="/update_status/{{ o[0] }}/Cancelled?pw={{ pw }}" class="btn" style="background:red;">CANCEL</a>
        {% endif %}
    </div>
    {% endfor %}
</body>
</html>
