<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Order List</title>
</head>
<body style="font-family: sans-serif; padding: 10px;">
    <h2 style="text-align: center;">ဝင်လာသမျှ Order များ</h2>
    
    <table border="1" style="width: 100%; border-collapse: collapse; text-align: left;">
        <tr style="background: #eee;">
            <th style="padding: 10px;">အမည်</th>
            <th style="padding: 10px;">မှာသည့်ပစ္စည်း</th>
            <th style="padding: 10px;">လိပ်စာ</th>
        </tr>
        {% for order in orders %}
        <tr>
            <td style="padding: 10px;">{{ order[1] }}</td>
            <td style="padding: 10px;">{{ order[3] }}</td>
            <td style="padding: 10px;">{{ order[2] }}</td>
        </tr>
        {% endfor %}
    </table>
    
    <br>
    <a href="/" style="display: block; text-align: center;">Back to Shop</a>
</body>
</html>
