<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <style>
        body { font-family: sans-serif; padding: 15px; background: #eee; }
        .box { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .btn { padding: 8px 15px; border-radius: 5px; text-decoration: none; color: white; font-weight: bold; margin-right: 5px; font-size: 0.8rem; }
    </style>
</head>
<body>
    <h2>ADMIN PANEL</h2>
    {% for o in orders %}
    <div class="box">
        <p><b>ID: #{{ o[0] }} - {{ o[4] }}</b></p>
        <p>{{ o[1] }} | {{ o[3] }}</p>
        <p><small>{{ o[2] }}</small></p>
        {% if o[4] == 'Pending' %}
        <a href="/update_status/{{ o[0] }}/Confirmed?pw={{ pw }}" class="btn" style="background:green;">CONFIRM</a>
        <a href="/update_status/{{ o[0] }}/Cancelled?pw={{ pw }}" class="btn" style="background:red;">CANCEL</a>
        {% endif %}
    </div>
    {% endfor %}
</body>
</html>
