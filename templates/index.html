<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Drink Shop</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background: #f5f0eb; padding: 20px; }
        h1 { text-align: center; color: #6b4226; margin-bottom: 20px; }
        .categories { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .categories a { padding: 10px 20px; background: #fff; border-radius: 25px; text-decoration: none; color: #333; font-weight: bold; border: 2px solid #ddd; }
        .categories a.active { background: #6b4226; color: #fff; border-color: #6b4226; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; }
        .menu-item { background: #fff; border-radius: 15px; padding: 20px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .menu-item .emoji { font-size: 40px; }
        .menu-item h3 { margin: 10px 0; font-size: 14px; }
        .menu-item .price { color: #6b4226; font-weight: bold; }
        .menu-item a { display: inline-block; margin-top: 10px; padding: 8px 20px; background: #6b4226; color: #fff; border-radius: 20px; text-decoration: none; font-size: 12px; }
        .cart-info { text-align: center; margin-top: 20px; }
        .cart-info a { color: #6b4226; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>
    <h1>☕ My Drink Shop</h1>
    <div class="categories">
        <a href="/" class="{{ 'active' if active_cat == 'ALL' }}">ALL</a>
        <a href="/?category=COFFEE" class="{{ 'active' if active_cat == 'COFFEE' }}">☕ COFFEE</a>
        <a href="/?category=CAKE" class="{{ 'active' if active_cat == 'CAKE' }}">🍰 CAKE</a>
        <a href="/?category=SNACK" class="{{ 'active' if active_cat == 'SNACK' }}">🥐 SNACK</a>
    </div>
    <div class="menu-grid">
        {% for drink in drinks %}
        <div class="menu-item">
            <div class="emoji">{{ drink.emoji }}</div>
            <h3>{{ drink.name }}</h3>
            <div class="price">{{ drink.price }} MMK</div>
            <a href="/add_to_cart/{{ drink.id }}">+ Add</a>
        </div>
        {% endfor %}
    </div>
    <div class="cart-info">
        <p>🛒 Cart: {{ session.get('cart', [])|length }} items</p>
        <form action="/checkout" method="POST" style="display:inline;">
            <button type="submit" style="padding:10px 30px; background:#6b4226; color:#fff; border:none; border-radius:25px; font-size:14px; cursor:pointer;">Checkout</button>
        </form>
        <p style="margin-top:10px;"><a href="/history">📋 Order History</a> | <a href="/hardees">🍔 Hardee's</a></p>
    </div>
</body>
</html>
