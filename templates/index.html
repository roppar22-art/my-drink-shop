<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Coffee Lab</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --dark: #1a1a1a; --gold: #d4a373; --bg: #f9f7f2; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); }
        nav { background: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; sticky: top; z-index: 10; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .hero { height: 35vh; background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=800'); background-size: cover; display: flex; align-items: center; justify-content: center; color: white; text-align: center; }
        .menu-grid { padding: 20px; display: grid; grid-template-columns: 1fr; gap: 15px; }
        .card { background: white; display: flex; border-radius: 12px; overflow: hidden; box-shadow: 0 3px 6px rgba(0,0,0,0.05); }
        .card img { width: 110px; height: 110px; object-fit: cover; }
        .info { padding: 12px; flex-grow: 1; }
        .price { color: var(--gold); font-weight: bold; margin: 5px 0; }
        .btn { background: var(--dark); color: white; padding: 8px 15px; border-radius: 5px; text-decoration: none; display: inline-block; font-size: 0.8rem; }
        .cart-float { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--dark); color: white; padding: 12px 30px; border-radius: 30px; text-decoration: none; font-weight: bold; width: 80%; text-align: center; }
    </style>
</head>
<body>
<nav>
    <a href="/track" style="color:black"><i class="fa-solid fa-bars"></i></a>
    <div style="font-weight:bold; letter-spacing:1px;">THE COFFEE LAB</div>
    <a href="/cart" style="color:black"><i class="fa-solid fa-bag-shopping"></i></a>
</nav>

<div class="hero">
    <div><h1>PREMIUM BREW</h1><p>Experience the finest coffee</p></div>
</div>

<div class="menu-grid">
    {% for d in drinks %}
    <div class="card">
        <img src="{{ d.img }}">
        <div class="info">
            <div style="font-weight:bold">{{ d.name }}</div>
            <div class="price">{{ "{:,}".format(d.price) }} Ks</div>
            <a href="/add_to_cart/{{ d.id }}" class="btn">ADD TO CART</a>
        </div>
    </div>
    {% endfor %}
</div>

<a href="/cart" class="cart-float">
    VIEW CART ({{ session['cart']|length if session['cart'] else 0 }})
</a>
</body>
</html>
