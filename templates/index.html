<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Coffee House</title>
    <link href="https://fonts.googleapis.com/css2?family=Pyidaungsu:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Pyidaungsu', sans-serif;
            margin: 0;
            background-color: #fcf8f5;
            color: #3e2723;
        }
        header {
            background-color: #3e2723;
            color: white;
            padding: 30px 20px;
            text-align: center;
        }
        .menu-container {
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .menu-item {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        .menu-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
            background-color: #eee; /* ပုံမပွင့်ခင် ပြနေမယ့်အရောင် */
        }
        .item-details {
            padding: 20px;
        }
        .item-name {
            font-weight: bold;
            font-size: 20px;
            margin-bottom: 8px;
        }
        .item-price {
            color: #d35400;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .order-btn {
            background-color: #5d4037;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>
<body>

<header>
    <h1>The Coffee House</h1>
    <p>☕️ အရသာရှိသော ကော်ဖီနှင့် ဖျော်ရည်များ ☕️</p>
</header>

<div class="menu-container">
    {% for drink in drinks %}
    <div class="menu-item">
        {% if drink.id == 1 %}
            <img src="https://www.thespruceeats.com/thmb/N_Yn4Y9dCq9o1uE4u8nS_Y_Y7Y8=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc()/green-tea-benefits-764350-hero-be88c0c4c4b44b8b9b8b8b8b8b8b8b8b.jpg" alt="Green Tea">
        {% elif drink.id == 2 %}
            <img src="https://images.immediate.co.uk/production/volatile/sites/30/2021/06/Bubble-tea-862d5d1.jpg" alt="Milk Tea">
        {% elif drink.id == 3 %}
            <img src="https://images.unsplash.com/photo-1541167760496-162955ed8a9f?q=80&w=600&auto=format&fit=crop" alt="Coffee">
        {% else %}
            <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?q=80&w=600&auto=format&fit=crop" alt="Default">
        {% endif %}
        
        <div class="item-details">
            <div class="item-name">{{ drink.name }}</div>
            <div class="item-price">{{ "{:,}".format(drink.price) }} Ks</div>
            <a href="/order/{{ drink.id }}" class="order-btn">ခုပဲ မှာယူမယ်</a>
        </div>
    </div>
    {% endfor %}
</div>

</body>
</html>
